<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64">
  <!-- Fundo escuro sutil com borda neon roxa -->
  <rect width="24" height="24" rx="6" fill="#07070f"/>
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.5" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.6"/>
  
  <!-- Caveira estilizada Hacker / Cyber-sec -->
  <g fill="#a78bfa" stroke="#c4b5fd" stroke-width="0.3" stroke-linejoin="round">
    <!-- Crânio -->
    <path d="M12 2.5C7.3 2.5 3.8 6.1 3.8 10.6c0 2.5 1.1 4.7 2.9 6.2.4.3.7.8.7 1.3v1.4c0 .6.5 1 1.1 1h7c.6 0 1.1-.4 1.1-1v-1.4c0-.5.3-1 .7-1.3 1.8-1.5 2.9-3.7 2.9-6.2 0-4.5-3.5-8.1-8.2-8.1z"/>
    
    <!-- Olhos vazados (recorte escuro com brilho neon) -->
    <ellipse cx="8.5" cy="10.8" rx="1.9" ry="2.4" fill="#07070f" stroke="#7c3aed" stroke-width="0.5"/>
    <ellipse cx="15.5" cy="10.8" rx="1.9" ry="2.4" fill="#07070f" stroke="#7c3aed" stroke-width="0.5"/>
    
    <!-- Pupilas cibernéticas -->
    <circle cx="8.5" cy="10.8" r="0.6" fill="#c4b5fd"/>
    <circle cx="15.5" cy="10.8" r="0.6" fill="#c4b5fd"/>
    
    <!-- Nariz triangular -->
    <polygon points="12,13.2 10.8,15.2 13.2,15.2" fill="#07070f"/>
    
    <!-- Dentes / Maxilar -->
    <line x1="10" y1="18" x2="10" y2="20.5" stroke="#07070f" stroke-width="0.9"/>
    <line x1="12" y1="18" x2="12" y2="20.5" stroke="#07070f" stroke-width="0.9"/>
    <line x1="14" y1="18" x2="14" y2="20.5" stroke="#07070f" stroke-width="0.9"/>
  </g>
</svg>
